# Example: the "smard" code location of ktest-app (dagster/smard). Copy
# this directory per environment and replace the values marked CHANGE; the
# workspace entry is in apps/dagster-workspace. The Secret "smard-code-
# location-env" is not part of this overlay, see README.md:
#   SMARD_S3_ACCESS_KEY_ID, SMARD_S3_SECRET_ACCESS_KEY
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: dagster # CHANGE: the namespace of the Dagster Helm release
namePrefix: smard-

labels:
  - pairs:
      app.kubernetes.io/instance: smard
    includeSelectors: true

images:
  - name: dagster-code-location
    newName: ghcr.io/chrismich-k/ktest-app/dagster-smard # CHANGE if using your own built image
    newTag: latest # or a fixed tag, e.g. sha-1a2b3c4

configMapGenerator:
  - name: code-location-config
    literals:
      - DAGSTER_MODULE_NAME=ktest.smard.definitions
      - SMARD_ICEBERG_REST_URI=http://iceberg-rest.example.svc.cluster.local:9001/iceberg # CHANGE
      - SMARD_ICEBERG_WAREHOUSE=s3a://iceberg-warehouse/warehouse # CHANGE
      - SMARD_ICEBERG_NAMESPACE=smard
      - SMARD_S3_ENDPOINT=http://s3.example.svc.cluster.local:9000 # CHANGE
