# Example: the "tradinghub_eu" code location of ktest-app
# (dagster/tradinghub_eu). Copy this directory per environment and replace
# the values marked CHANGE; the workspace entry is in
# apps/dagster-workspace. The Secret "tradinghub-eu-code-location-env" is
# not part of this overlay, see README.md:
#   TRADINGHUB_EU_S3_ACCESS_KEY_ID, TRADINGHUB_EU_S3_SECRET_ACCESS_KEY
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: dagster # CHANGE: the namespace of the Dagster Helm release
namePrefix: tradinghub-eu-

labels:
  - pairs:
      app.kubernetes.io/instance: tradinghub-eu
    includeSelectors: true

images:
  - name: dagster-code-location
    newName: ghcr.io/chrismich-k/ktest-app/dagster-tradinghub-eu # CHANGE if using your own built image
    newTag: latest # or a fixed tag, e.g. sha-1a2b3c4

configMapGenerator:
  - name: code-location-config
    literals:
      - DAGSTER_MODULE_NAME=ktest.tradinghub_eu.definitions
      - TRADINGHUB_EU_ICEBERG_REST_URI=http://iceberg-rest.example.svc.cluster.local:9001/iceberg # CHANGE
      - TRADINGHUB_EU_ICEBERG_WAREHOUSE=s3a://iceberg-warehouse/warehouse # CHANGE
      - TRADINGHUB_EU_ICEBERG_NAMESPACE=tradinghub_eu
      - TRADINGHUB_EU_S3_ENDPOINT=http://s3.example.svc.cluster.local:9000 # CHANGE
      # sent to tradinghub.eu with every request: name and contact
      - THE_USER_AGENT=ktest-tradinghub-eu/0.1 (+https://example.com) # CHANGE
